<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="table.html"></a>
    <button onclick="window.location.href='table.html'">Table</button>
    <form action="" method="post" align="center">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" placeholder="Enter your name"><br><br>
        <label for="gender">Gender:</label>
        <select name="gender" id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
            <option value="prefer_not_to_say">Prefer not to say</option>
        </select><br><br>
        <label for="city">City:</label>
        <input type="text" name="city" id="city" placeholder="Enter your city"><br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email"><br><br>
        <label for="url">Facebook Link:</label>
        <input type="url" name="url" id="url" placeholder="Enter your Facebook URL"><br><br>
        <label for="phone">Phone:</label>
        <input type="tel" name="phone" id="phone" placeholder="Enter your phone number"><br><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter your password"><br><br>

        <label for="skills">Skills:</label><br>
        <input type="checkbox" name="skills" value="html"> HTML<br>
        <input type="checkbox" name="skills" value="css"> CSS<br>
        <input type="checkbox" name="skills" value="javascript"> JS<br>
        <label for="country">Country:</label>
        <select name="country" id="country">
            <option value="bangladesh">Bangladesh</option>
            <option value="india">India</option>
            <option value="pakistan">Pakistan</option>
            <option value="nepal">Nepal</option>
        </select><br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob"><br><br>
        <label for="comments">Comments:</label><br>
        <textarea name="comments" id="comments" rows="4" cols="50" placeholder="Enter your comments"></textarea><br><br>
        <label for="file">Upload File:</label>
        <input type="file" name="file" id="file"><br><br>
        <label for="voice">Voice Input:</label>
        <input type="text" name="voice" id="voice" placeholder="Speak now" x-webkit-speech><br><br>
        <label for="color">Favorite Color:</label>  
        <label for="color">Color:</label>
        <input type="color" name="color" id="color"><br><br>
        <label for="range">Range:</label>
        <input type="range" name="range" id="range" min="0" max="100"><br><br>
        <label for="search">Search:</label>
        <input type="search" name="search" id="search" placeholder="Search..."><br><br>

        <label for="time">Time:</label>
        <input type="time" name="time" id="time"><br><br>

         <input  imgsrc="submit.png" type="submit" value="Submit">
         
         
         <input type="reset" value="Reset">
    </form>
</body>
</html>
